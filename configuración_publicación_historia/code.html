<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Configuración Publicación Historia</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e9638f",
                        "background-light": "#f8f6f6",
                        "background-dark": "#211116",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "Noto Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hiding for clean UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-[#171113] dark:text-white transition-colors duration-200">
<div class="relative flex h-full min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<!-- Top App Bar -->
<div class="sticky top-0 z-20 flex items-center bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-md p-4 pb-2 justify-between border-b border-gray-100 dark:border-gray-800">
<button class="text-gray-900 dark:text-white flex size-12 shrink-0 items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<h2 class="text-gray-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">
                Nueva Historia
            </h2>
</div>
<!-- Main Content Scroll Area -->
<div class="flex-1 flex flex-col pb-28"> <!-- Added padding bottom for fixed footer -->
<!-- Story Preview Section -->
<div class="px-6 py-6 flex justify-center">
<div class="relative w-48 aspect-[3/4] rounded-2xl overflow-hidden shadow-lg ring-4 ring-white dark:ring-gray-800 bg-gray-200">
<div class="absolute inset-0 bg-cover bg-center" data-alt="Delicious pasta dish with fresh basil close up" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCAmQyhWV0vUKHrp4AU0qx_jBmnIWjh4zljBkHmAqaSvIk6VQph0NExuouKaJgNqtE24Xu1WfzyIGfibMgZ2i1hongv-fv3f9w3XyhNgaNXQQ3Yyc_-GHqFtJfCD82GzKpSSIVWBSlVstFoKxWu6u1AJhWp53RJJZAf0nCKBEylsj5zcPTCXBl2BnRA20bIpb1kI_9fv-J4DyIK3BUN0MUYlSz2RsLTL-ShD3qn-JzJ46vEzvJWarYbznki0k0sEnEikgJjUw0fuv0");'>
</div>
<!-- Overlay Gradient -->
<div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
<div class="absolute bottom-3 left-3 right-3 flex items-center gap-2">
<span class="material-symbols-outlined text-white text-sm">restaurant</span>
<span class="text-white text-xs font-medium">Vista Previa</span>
</div>
</div>
</div>
<!-- Description Input -->
<div class="px-4 mb-2">
<label class="sr-only" for="description">Descripción</label>
<div class="relative">
<textarea class="w-full bg-white dark:bg-[#2f1c22] rounded-xl p-4 text-gray-900 dark:text-white placeholder:text-gray-400 dark:placeholder:text-gray-500 border-none focus:ring-2 focus:ring-primary/50 resize-none shadow-sm text-base" id="description" placeholder="Describe tu plato delicioso..." rows="3"></textarea>
<span class="absolute bottom-3 right-3 text-xs text-gray-400">0/120</span>
</div>
</div>
<!-- Tags Input -->
<div class="px-4 mb-6">
<div class="flex items-center gap-2 bg-white dark:bg-[#2f1c22] rounded-xl p-3 shadow-sm">
<span class="material-symbols-outlined text-primary">tag</span>
<input class="w-full bg-transparent border-none p-0 text-gray-900 dark:text-white placeholder:text-gray-400 dark:placeholder:text-gray-500 focus:ring-0 text-sm" placeholder="Añadir etiquetas (ej. #Pasta, #CenaRápida)" type="text"/>
</div>
<!-- Suggested Tags Pills -->
<div class="flex gap-2 mt-3 overflow-x-auto no-scrollbar px-1">
<button class="shrink-0 px-3 py-1.5 bg-primary/10 dark:bg-primary/20 text-primary text-xs font-bold rounded-full hover:bg-primary/20 transition-colors">#Vegano</button>
<button class="shrink-0 px-3 py-1.5 bg-primary/10 dark:bg-primary/20 text-primary text-xs font-bold rounded-full hover:bg-primary/20 transition-colors">#SinGluten</button>
<button class="shrink-0 px-3 py-1.5 bg-primary/10 dark:bg-primary/20 text-primary text-xs font-bold rounded-full hover:bg-primary/20 transition-colors">#Italiano</button>
<button class="shrink-0 px-3 py-1.5 bg-primary/10 dark:bg-primary/20 text-primary text-xs font-bold rounded-full hover:bg-primary/20 transition-colors">#Picante</button>
</div>
</div>
<!-- Duration Settings -->
<div class="px-4">
<h3 class="text-gray-900 dark:text-white text-base font-bold leading-tight px-1 pb-3 pt-2">Duración de la historia</h3>
<div class="flex h-12 w-full items-center justify-center rounded-xl bg-primary/10 dark:bg-[#3b2d32] p-1">
<label class="group flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-[#e9638f] has-[:checked]:shadow-sm transition-all duration-200">
<span class="truncate text-gray-500 dark:text-gray-400 group-has-[:checked]:text-primary dark:group-has-[:checked]:text-white text-sm font-bold">12 Horas</span>
<input class="invisible w-0 absolute" name="duration" type="radio" value="12 Horas"/>
</label>
<label class="group flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-[#e9638f] has-[:checked]:shadow-sm transition-all duration-200">
<span class="truncate text-gray-500 dark:text-gray-400 group-has-[:checked]:text-primary dark:group-has-[:checked]:text-white text-sm font-bold">24 Horas</span>
<input checked="" class="invisible w-0 absolute" name="duration" type="radio" value="24 Horas"/>
</label>
</div>
</div>
<!-- Audience Settings -->
<div class="px-4 mt-6">
<h3 class="text-gray-900 dark:text-white text-base font-bold leading-tight px-1 pb-3 pt-2">Audiencia</h3>
<div class="grid grid-cols-2 gap-3">
<!-- Option 1: Everyone -->
<label class="cursor-pointer relative">
<input checked="" class="peer sr-only" name="audience" type="radio" value="todos"/>
<div class="flex flex-col items-center justify-center p-4 rounded-2xl border-2 border-transparent bg-white dark:bg-[#2f1c22] shadow-sm peer-checked:border-primary peer-checked:bg-primary/5 dark:peer-checked:bg-primary/10 transition-all">
<div class="w-10 h-10 rounded-full bg-blue-100 text-blue-500 flex items-center justify-center mb-2 dark:bg-blue-900/30 dark:text-blue-300">
<span class="material-symbols-outlined">public</span>
</div>
<span class="text-sm font-bold text-gray-900 dark:text-white">Todos</span>
<span class="text-xs text-gray-500 dark:text-gray-400 mt-1">Público</span>
<!-- Checkmark Icon -->
<div class="absolute top-2 right-2 text-primary opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-[20px] fill-1">check_circle</span>
</div>
</div>
</label>
<!-- Option 2: Friends Only -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="audience" type="radio" value="amigos"/>
<div class="flex flex-col items-center justify-center p-4 rounded-2xl border-2 border-transparent bg-white dark:bg-[#2f1c22] shadow-sm peer-checked:border-primary peer-checked:bg-primary/5 dark:peer-checked:bg-primary/10 transition-all">
<div class="w-10 h-10 rounded-full bg-green-100 text-green-500 flex items-center justify-center mb-2 dark:bg-green-900/30 dark:text-green-300">
<span class="material-symbols-outlined">stars</span>
</div>
<span class="text-sm font-bold text-gray-900 dark:text-white">Solo Amigos</span>
<span class="text-xs text-gray-500 dark:text-gray-400 mt-1">Privado</span>
<!-- Checkmark Icon -->
<div class="absolute top-2 right-2 text-primary opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-[20px] fill-1">check_circle</span>
</div>
</div>
</label>
</div>
</div>
<!-- Additional Options (Optional) -->
<div class="px-4 mt-6">
<div class="flex items-center justify-between p-3 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer">
<div class="flex items-center gap-3">
<div class="p-2 rounded-lg bg-orange-100 text-orange-500 dark:bg-orange-900/30 dark:text-orange-300">
<span class="material-symbols-outlined text-[20px]">location_on</span>
</div>
<span class="text-sm font-medium text-gray-700 dark:text-gray-200">Añadir ubicación</span>
</div>
<span class="material-symbols-outlined text-gray-400 text-sm">chevron_right</span>
</div>
</div>
</div>
<!-- Fixed Bottom Action Button -->
<div class="fixed bottom-0 left-0 w-full bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md p-4 pb-8 z-30 border-t border-gray-100 dark:border-gray-800">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold text-lg py-4 rounded-2xl shadow-lg shadow-primary/30 flex items-center justify-center gap-2 transition-transform active:scale-[0.98]">
<span>Publicar Historia</span>
<span class="material-symbols-outlined text-[20px]">send</span>
</button>
</div>
</div>
</body></html>

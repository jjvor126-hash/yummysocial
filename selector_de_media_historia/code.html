<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Selector de Media Historia</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e9a663",
                        "primary-light": "#fdf3e8", 
                        "background-light": "#f8f7f6",
                        "background-dark": "#211911",
                        "card-light": "#ffffff",
                        "card-dark": "#2e251e",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "2xl": "2rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#171411] dark:text-gray-100 transition-colors duration-200">
<div class="relative flex h-full min-h-screen w-full flex-col max-w-md mx-auto bg-background-light dark:bg-background-dark overflow-x-hidden shadow-2xl">
<!-- Top App Bar -->
<header class="flex items-center px-4 py-4 justify-between bg-transparent z-10">
<button aria-label="Close" class="flex size-10 shrink-0 items-center justify-center rounded-full bg-white/80 dark:bg-black/20 hover:bg-gray-100 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-[#171411] dark:text-white" style="font-size: 24px;">close</span>
</button>
<h1 class="text-[#171411] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] text-center">Nueva Historia</h1>
<div class="size-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col justify-center px-6 gap-8 pb-12">
<!-- Headline Section -->
<div class="text-center space-y-2 animate-fade-in-up">
<h2 class="text-3xl font-extrabold text-[#171411] dark:text-white tracking-tight leading-tight">
                    ¿Qué vas a <br/><span class="text-primary">cocinar hoy?</span>
</h2>
<p class="text-gray-500 dark:text-gray-400 text-base font-normal">
                    Comparte tu receta favorita con la comunidad.
                </p>
</div>
<!-- Action Cards Grid -->
<div class="grid grid-cols-1 gap-4 w-full mt-4">
<!-- Camera Option -->
<button class="group relative flex flex-col items-center justify-center gap-4 rounded-2xl p-8 transition-all duration-300 hover:scale-[1.02] active:scale-[0.98] border-2 border-transparent hover:border-primary/30 bg-card-light dark:bg-card-dark shadow-sm hover:shadow-md h-64 overflow-hidden">
<div class="absolute inset-0 bg-primary/5 dark:bg-primary/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<!-- Background decoration image -->
<div class="absolute inset-0 opacity-10 dark:opacity-20" data-alt="Abstract kitchen counter texture" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuB5BU5CiT2IU2nWRoV4ZnQsBmzzul17xeIZlZal1dTymXcrFgvjtXwLXDt2glJwzFFIBSe285Cyf2JDy1gzZdLJqUGZtUAYeHhimqOU3Q8MoqDy_LuKxCkDGrLLHpsKNLihvzHE7siyPv5noPgDLgcFhPGTfxpV4rM05FRpB5xf_IxyCtCcZXnt78-k22eFXpZ-H21ttscQWOkyqBIQ1NVgARPdy0KLx4LrjnAiwh_BlPkFqZDNCr-moAhD-R5G0njfr7M27NW7dVM'); background-size: cover; background-position: center;">
</div>
<div class="relative z-10 flex size-20 items-center justify-center rounded-full bg-primary/10 text-primary group-hover:bg-primary group-hover:text-white transition-colors duration-300">
<span class="material-symbols-outlined" style="font-size: 40px;">photo_camera</span>
</div>
<div class="relative z-10 text-center space-y-1">
<h3 class="text-xl font-bold text-[#171411] dark:text-white group-hover:text-primary transition-colors">Tomar Foto/Video</h3>
<p class="text-sm text-gray-500 dark:text-gray-400">Usa tu cámara ahora</p>
</div>
</button>
<!-- Gallery Option -->
<button class="group relative flex flex-col items-center justify-center gap-4 rounded-2xl p-8 transition-all duration-300 hover:scale-[1.02] active:scale-[0.98] border-2 border-transparent hover:border-primary/30 bg-card-light dark:bg-card-dark shadow-sm hover:shadow-md h-64 overflow-hidden">
<div class="absolute inset-0 bg-primary/5 dark:bg-primary/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<!-- Background decoration image -->
<div class="absolute inset-0 opacity-10 dark:opacity-20" data-alt="Blurred vegetables and cooking ingredients" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBh0AaPGsmJ5uN53C-FQIbXZFXW5w6Vv8M6GCtWYInmD2GmKv1C9TcIpD0moXYe2V4MnDFmJ6h2idIslVew-GHSeub1qoco9T3_2bKrQQoL_9C2hUHXjH9eihQx9Fe4t5ylmKz0vLpEoiC_mco54ypPjCh54E33gYOPT6vK45tYLQUMrOwTS7oTzqhhm-2_7yafUIE0uBehYhgPJdnGb6szy-7iAIwfeYhiFaRdTiC6c0eYwYD5IhqDJyU1vtFoHeDZlQfvlmXH85M'); background-size: cover; background-position: center;">
</div>
<div class="relative z-10 flex size-20 items-center justify-center rounded-full bg-primary/10 text-primary group-hover:bg-primary group-hover:text-white transition-colors duration-300">
<span class="material-symbols-outlined" style="font-size: 40px;">photo_library</span>
</div>
<div class="relative z-10 text-center space-y-1">
<h3 class="text-xl font-bold text-[#171411] dark:text-white group-hover:text-primary transition-colors">Seleccionar de la Galería</h3>
<p class="text-sm text-gray-500 dark:text-gray-400">Sube desde tu teléfono</p>
</div>
</button>
</div>
</main>
<!-- Footer / Permissions Hint -->
<footer class="p-6 text-center">
<p class="text-xs text-gray-400 dark:text-gray-500 max-w-xs mx-auto">
                Al continuar, permites que Nueva Historia acceda a tu cámara y fotos para crear contenido.
            </p>
</footer>
</div>
</body></html>
